name: Build Unified (D3D1-12)

on:
  push:
    branches: [vkd3d]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unified-mingw:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dxvk-unified
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Build unified package
        uses: Joshua-Ashton/arch-mingw-github-action@v8
        with:
          command: |
            set -e

            export VERSION_NAME="dxvk-unified-${GITHUB_SHA::8}"

            # Init only DXVK's own submodules — skip vkd3d-proton/ subtree gitlinks
            git submodule update --init --recursive -- \
              include/native/directx include/vulkan include/spirv \
              subprojects/libdisplay-info subprojects/dxbc-spirv

            # Clone VKD3D-Proton fresh so its nested submodules initialise properly
            git clone --recurse-submodules \
              https://github.com/HansKristian-Work/vkd3d-proton.git \
              vkd3d-proton-src

            # ── Build DXVK (D3D8/9/10/11) ────────────────────────────────────
            ./package-release.sh "${VERSION_NAME}" build --no-package
            mv build/dxvk-"${VERSION_NAME}" build/dxvk-out

            # ── Build VKD3D-Proton (D3D12) ────────────────────────────────────
            cd vkd3d-proton-src
            ./package-release.sh "${VERSION_NAME}" ../build --no-package
            cd ..
            mv build/vkd3d-proton-"${VERSION_NAME}" build/vkd3d-out

            # ── Pack into .wcp (tar + zstd) ───────────────────────────────────
            WCP_STAGE="build/wcp-stage"
            mkdir -p "$WCP_STAGE/system32" "$WCP_STAGE/syswow64"

            # x64 → system32, x32 → syswow64
            cp build/dxvk-out/x64/*.dll   "$WCP_STAGE/system32/" 2>/dev/null || true
            cp build/vkd3d-out/x64/*.dll  "$WCP_STAGE/system32/" 2>/dev/null || true
            cp build/dxvk-out/x32/*.dll   "$WCP_STAGE/syswow64/" 2>/dev/null || true
            cp build/vkd3d-out/x32/*.dll  "$WCP_STAGE/syswow64/" 2>/dev/null || true

            echo "system32:"; ls "$WCP_STAGE/system32/"
            echo "syswow64:"; ls "$WCP_STAGE/syswow64/"

            python3 scripts/gen_profile.py "$WCP_STAGE" "$VERSION_NAME"

            # Pack: tar then zstd compress → .wcp
            cd build/wcp-stage
            tar -cf "../${VERSION_NAME}.tar" profile.json system32 syswow64
            cd ..
            zstd --ultra -22 "${VERSION_NAME}.tar" -o "${VERSION_NAME}.wcp"
            rm "${VERSION_NAME}.tar"
            cd ..

            echo "WCP=build/${VERSION_NAME}.wcp" >> $GITHUB_ENV
            echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
            echo "Built: build/${VERSION_NAME}.wcp ($(du -sh build/${VERSION_NAME}.wcp | cut -f1))"

      - name: Create release and upload .wcp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.VERSION_NAME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.VERSION_NAME }}" \
            --notes "Unified Direct3D 1–12 → Vulkan translation layer

          **Contents:**
          - \`d3d8.dll\` / \`d3d9.dll\` / \`d3d10core.dll\` / \`d3d11.dll\` / \`dxgi.dll\` — DXVK 2.7.1 (D3D8–11)
          - \`d3d12.dll\` / \`d3d12core.dll\` — VKD3D-Proton 3.0b (D3D12)

          **Install:** drop the \`.wcp\` into BannerHub or Nightlies component list." \
            "${{ env.WCP }}"
